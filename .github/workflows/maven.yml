name: Maven Build
on:
	push:
		branches:["main"]
	pull_request:
		branches:["main"]
jobs:
	build:
		runs-on:ubantu-latest
		steps:
		    -name: checkout source code
			 uses: actions/checkout@v6
			-name: set up JCK
			 uses: actions/setup=java@v5
			 with:
				java-version: '17'
				distribution: temurin
				cache: maven
			-name: build with maven
			 run: mvn -B clean package
			 